[project]
name = "sumr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ali Al-Alak", email = "a.alalak@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "openai>=2.21.0",
    "pydantic-settings>=2.13.1",
    "rich>=14.3.3",
    "typer>=0.24.0",
]

[project.scripts]
sumr = "sumr:main"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-randomly>=4.0.1",
    "ruff>=0.15.2",
    "ty>=0.0.17",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["sumr"]

[tool.coverage.report]
show_missing = true
skip_empty = true
